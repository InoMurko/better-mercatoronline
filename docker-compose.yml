# docker compose up -d          → the bot, restarted automatically
# docker compose run --rm agent cli due
services:
  agent:
    build: .
    image: merc-agent
    pull_policy: build                # always build locally – there's no published image to pull
    container_name: merc-agent
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]   # nothing in the container can gain privileges (setpriv only drops them)
    # root in the entrypoint only needs to hand /data over and drop to that user; everything else is dropped
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    env_file: .env
    environment:
      TZ: ${TZ:-Europe/Ljubljana}     # the daily check runs at DAILY_CHECK_AT in this time zone
    volumes:
      - ./data:/data                  # orders/, history.json, .session.json, .basket.json
    command: ["bot"]
